<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Contact Us — Law Firm</title>
  <meta id="meta-description" name="description" content="">
  <meta name="robots" content="index, follow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="icon" href="icons/logo-justice.svg">
  <link rel="stylesheet" href="css/styles.css">
  <script type="application/ld+json" id="schema-ld"></script>
</head>
<body data-page="contact">

  <a class="skip-link" href="#main">Skip to content</a>

  <section class="hero" id="contact-hero-section" style="padding-bottom:70px;">
    <div class="hero-bg" aria-hidden="true"><img src="images/contact-hero.png" alt=""><div class="bg-glow" aria-hidden="true"><span class="blob blob-1"></span><span class="blob blob-2"></span><span class="blob blob-3"></span></div></div>
      <canvas class="particles-canvas" aria-hidden="true"></canvas>
    <header class="site-header" id="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="index.html">
          <span class="brand-icon" aria-hidden="true">
            <img src="icons/logo-vector.svg" alt="">
            <img src="icons/logo-justice.svg" alt="">
          </span>
          <span class="brand-name" id="brand-name">Law Firm</span>
        </a>
        <nav class="main-nav" id="main-nav" aria-label="Primary">
          <ul id="nav-list"></ul>
        </nav>
        <div class="header-actions" style="display:flex;align-items:center;gap:20px;">
          <a class="header-phone" id="header-phone" href="#">
            <img src="icons/phone-icon.svg" alt="">
            <span id="header-phone-text"></span>
          </a>
          <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </header>

    <div class="contact-hero-copy reveal">
      <h1 id="contact-heading"></h1>
      <p id="contact-paragraph"></p>
    </div>

    <div class="contact-details-grid" id="contact-details-grid"></div>
  </section>

  <main id="main">

    <div class="wrap">
      <div class="contact-form-wrap">
        <form class="consultation-form reveal" id="consultation-form">
          <div class="form-row-pair">
            <div class="form-field">
              <label for="f-name">Name</label>
              <input type="text" id="f-name" name="name" placeholder="Your Name" required>
            </div>
            <div class="form-field">
              <label for="f-phone">Phone</label>
              <input type="tel" id="f-phone" name="phone" placeholder="Your Phone" required>
            </div>
          </div>
          <div class="form-row-pair">
            <div class="form-field">
              <label for="f-email">Email</label>
              <input type="email" id="f-email" name="email" placeholder="Your Email" required>
            </div>
            <div class="form-field">
              <label for="f-service">Service</label>
              <select id="f-service" name="service"></select>
            </div>
          </div>
          <div class="form-field">
            <label for="f-subject">Subject</label>
            <input type="text" id="f-subject" name="subject" placeholder="Subject">
          </div>
          <div class="form-field">
            <label for="f-message">Message</label>
            <textarea id="f-message" name="message" rows="4" placeholder="Message"></textarea>
          </div>
          <button type="submit" class="btn btn-block">Request consultation</button>
          <p class="form-note" id="form-note" hidden>Thanks — this is a demo form and isn't wired to send yet. Hook it up to your email or a form service before launch.</p>
        </form>
      </div>
    </div>

    <!-- ============ MAP ============ -->
    <section class="map-section" id="map-section">
      <img class="map-bg" src="images/contact-map.png" alt="Map">
    </section>

    <!-- ============ BANNER ============ -->
    <section class="banner">
      <div class="banner-bg" aria-hidden="true"><img src="images/banner.png" alt=""><div class="bg-glow" aria-hidden="true"><span class="blob blob-1"></span><span class="blob blob-2"></span><span class="blob blob-3"></span></div></div>
      <div class="banner-copy reveal">
        <h2 id="banner-heading"></h2>
        <p id="banner-subtext" style="color:#e3e0d8;max-width:480px;"></p>
        <a class="btn" id="banner-cta" href="#consultation-form">Ask an expert</a>
      </div>
    </section>

  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer">
    <div class="footer-bg" aria-hidden="true"><img src="images/footer-bg.png" alt=""></div>
    <div class="footer-grid">
      <div class="footer-about">
        <a class="brand" href="index.html">
          <span class="brand-icon" aria-hidden="true">
            <img src="icons/footer-logo-vector.svg" alt="">
            <img src="icons/footer-logo-justice.svg" alt="">
          </span>
          <span class="brand-name" id="footer-brand-name">Law Firm</span>
        </a>
        <p id="footer-blurb"></p>
        <div class="footer-social">
          <a href="#" aria-label="Facebook"><img src="icons/footer-facebook.svg" alt=""></a>
          <a href="#" aria-label="Twitter"><img src="icons/footer-x-overlay.svg" alt=""></a>
          <a href="#" aria-label="Instagram"><img src="icons/footer-instagram.svg" alt=""></a>
          <a href="#" aria-label="Telegram"><img src="icons/footer-telegram.svg" alt=""></a>
        </div>
      </div>
      <div class="footer-col">
        <h3>Practice Areas</h3>
        <ul id="footer-practice-list"></ul>
      </div>
      <div class="footer-col">
        <h3>Find Us</h3>
        <ul>
          <li id="footer-address"></li>
          <li><a id="footer-phone" href="#"></a></li>
          <li><a id="footer-email" href="#"></a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h3>Links</h3>
        <ul id="footer-links-list"></ul>
      </div>
    </div>
    <div class="footer-bottom"><p id="footer-copyright"></p></div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/content.js"></script>
  <script src="js/render-contact.js"></script>
  <script src="js/render.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
